name: Kiểm thử web app bảng hiệu

on:
  push:
    paths: ['docs/**', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['docs/**', 'tests/**', '.github/workflows/tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chạy kiểm thử lõi tính toán và bản vẽ
        run: node --test tests/engine.test.js
